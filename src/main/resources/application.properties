spring.profiles.active=postgres
spring.application.name=theshireofpaws

server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8100,capacitor://localhost,https://localhost

spring.datasource.url=jdbc:h2:mem:theshireofpaws
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

logging.level.root=INFO
logging.level.com.theshireofpaws=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.secret=${JWT_SECRET:dev-only-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
